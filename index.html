async function handleDecision(form){
  if(!isOwner()){ toast('Only the owner can approve or decline'); return; }
  const id = form.dataset.id;
  const decision = form.dataset.decision;
  const note = form.querySelector('[name=note]').value.trim();
  const r = STATE.requests.find(x => x.id === id);
  if(!r || r.status !== 'pending'){ closeSheet(); render(); return; }
  if(decision === 'declined' && !note){ toast('Add a short reason for declining'); return; }
  if(!db){ toast('Storage unavailable'); return; }

  try{
    const updates = { status: decision, decisionNote: note, decidedAt: new Date().toISOString() };
    if(decision === 'approved'){
      const ref = await db.collection('transactions').add({
        type: 'expense',
        category: r.category || 'other',
        amount: Number(r.amount) || 0,
        date: todayISO(),
        pigId: null,
        supplierId: r.supplierId || null,
        note: 'Approved request: ' + r.title + (r.requestedBy ? ' (requested by ' + r.requestedBy + ')' : ''),
        receiptId: r.attachmentId || null,
        receiptUrl: r.attachmentUrl || null,
        requestId: id,
        createdAt: new Date().toISOString()
      });
      updates.transactionId = ref.id;
    }
    await db.doc('requests/' + id).update(updates);
    closeSheet();
    await loadAll();
    render();
    toast(decision === 'approved' ? 'Approved — expense added to the ledger' : 'Request declined');
  }catch(err){ console.error(err); toast('Could not save the decision'); }
}

async function handleWithdrawRequest(id){
  const r = STATE.requests.find(x => x.id === id);
  if(!r || r.status !== 'pending' || !db) return;
  try{

    const a = document.createElement('a');

}

function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight){
  const words = String(text).split(' ');
  let line = '', curY = y;
  for(let n=0;n<words.length;n++){
    const test = line + words[n] + ' ';
    if(ctx.measureText(test).width > maxWidth && n > 0){
      ctx.fillText(line, x, curY); line = words[n] + ' '; curY += lineHeight;
    } else { line = test; }
  }
  ctx.fillText(line, x, curY);
  return curY + lineHeight;
}

function buildReceiptCanvas(t){
  const canvas = document.createElement('canvas');
  canvas.width = 720; canvas.height = 900;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#FBF7EC'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle = '#A8442E'; ctx.lineWidth = 6; ctx.strokeRect(18,18,canvas.width-36,canvas.height-36);

  ctx.fillStyle = '#2B241C';
  ctx.font = '600 36px Georgia, serif';
  ctx.fillText(STATE.settings.name || 'BriidgeITFarm', 50, 96);
  ctx.fillStyle = '#6B5F4E';
  ctx.font = '400 17px sans-serif';
  ctx.fillText('Receipt', 50, 124);

  ctx.strokeStyle = '#DDD3BC'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(50,150); ctx.lineTo(670,150); ctx.stroke();

  let y = 200;
  const rows = [
    ['Date', fmtDate(t.date)],
    ['Type', t.type==='income' ? 'Income' : 'Expense'],
    ['Category', (t.category||'').charAt(0).toUpperCase() + (t.category||'').slice(1)]
  ];
  if(t.pigId) rows.push([vocab().A, pigName(t.pigId)]);
  if(t.supplierId){ const s = STATE.suppliers.find(x=>x.id===t.supplierId); if(s) rows.push(['Supplier', s.name]); }
  if(t.note) rows.push(['Note', t.note]);

  rows.forEach(r => {
    ctx.font = '400 20px sans-serif';
    ctx.fillStyle = '#6B5F4E';
    ctx.fillText(r[0], 50, y);
    ctx.font = '600 20px sans-serif';
    ctx.fillStyle = '#2B241C';
    y = wrapCanvasText(ctx, r[1], 230, y, 440, 26) + 14;
  });

  y += 20;
  ctx.strokeStyle = '#DDD3BC';
  ctx.beginPath(); ctx.moveTo(50,y); ctx.lineTo(670,y); ctx.stroke();
  y += 64;
  ctx.font = '600 42px Georgia, serif';
  ctx.fillStyle = t.type==='income' ? '#37502F' : '#A8442E';
  ctx.fillText((t.type==='income'?'+':'-') + money(t.amount), 50, y);

  ctx.font = '400 14px sans-serif';
  ctx.fillStyle = '#6B5F4E';
  ctx.fillText('Generated ' + new Date().toLocaleString(), 50, canvas.height - 36);

  return canvas;
}

function handleGenerateReceipt(txnId){
  const t = STATE.transactions.find(x => x.id === txnId);
  if(!t) return;
  const canvas = buildReceiptCanvas(t);
  canvas.toBlob(async (blob) => {
    if(!blob){ toast('Could not generate receipt'); return; }
    await downloadBlob('receipt-' + (t.date||todayISO()) + '.png', blob);
  }, 'image/png');
}

/* ============================== EVENT DELEGATION ============================== */
document.addEventListener('click', async (e) => {
  const navEl = e.target.closest('[data-nav]');
  const actionEl = e.target.closest('[data-action]');
  const closeEl = e.target.closest('[data-close-sheet]');
  const fieldEl = e.target.closest('[data-field]');

  if(closeEl){
    const navTarget = closeEl.getAttribute('data-nav');
    closeSheet();
    if(navTarget) location.hash = navTarget;
    return;
  }
  if(navEl && navEl.hasAttribute('data-nav')){
    const target = navEl.getAttribute('data-nav');
    if(target.startsWith('#')) location.hash = target;
    return;
  }
  if(fieldEl){
    const row = fieldEl.parentElement;
    [...row.children].forEach(c => c.classList.remove('selected'));
    fieldEl.classList.add('selected');
    if(fieldEl.dataset.field === 'source'){
      document.getElementById('bornFields').style.display = fieldEl.dataset.value === 'born' ? 'block' : 'none';
      document.getElementById('boughtFields').style.display = fieldEl.dataset.value === 'bought' ? 'block' : 'none';
    }
    if(fieldEl.dataset.field === 'payOption'){
      const isCash = fieldEl.dataset.value === 'cash';
      document.getElementById('cashFields').style.display = isCash ? 'block' : 'none';
      document.getElementById('pigletFields').style.display = isCash ? 'none' : 'block';
    }
    return;
  }
  if(actionEl){
    const action = actionEl.getAttribute('data-action');
    if(!isOwner() && ['delete-pig','delete-supplier','delete-agreement','decide-request','toggle-species'].indexOf(action) >= 0){ toast('Only the owner can do that'); return; }
    if(action === 'open-add-sheet'){ openAddSheet(); return; }
    if(action === 'quick-farm-photo'){ closeSheet(); await addFarmPhotoFlow(true); return; }
    if(action === 'filter-species'){ registrySpecies = actionEl.getAttribute('data-value'); render(); return; }
    if(action === 'toggle-species'){ await handleToggleSpecies(actionEl.getAttribute('data-value')); return; }
    if(action === 'filter-registry'){ registryFilter = actionEl.getAttribute('data-value'); render(); return; }
    if(action === 'filter-money'){ moneyFilter = actionEl.getAttribute('data-value'); render(); return; }
    if(action === 'delete-pig'){ await handleDeletePig(actionEl.getAttribute('data-id')); return; }
    if(action === 'delete-supplier'){ await handleDeleteSupplier(actionEl.getAttribute('data-id')); return; }
    if(action === 'mark-sold'){ openMarkSoldForm(actionEl.getAttribute('data-id')); return; }
    if(action === 'set-profile-photo'){ await handleSetProfilePhoto(actionEl.getAttribute('data-pig'), actionEl.getAttribute('data-photo')); return; }
    if(action === 'add-pig-photo'){ const f = await pickPhoto({ title: 'New photo' }); if(f) await handleAddPigPhoto(actionEl.getAttribute('data-id'), f); return; }
    if(action === 'copy-sql'){ await copyText(SUPABASE_SQL); toast('Setup SQL copied \u2014 paste it in Supabase \u2192 SQL Editor'); return; }
    if(action === 'copy-rules'){ await copyText(FIREBASE_RULES); toast('Firebase rules copied'); return; }
    if(action === 'view-receipt'){ openReceiptLightbox(actionEl.getAttribute('data-id')); return; }
    if(action === 'save-receipt-photo'){ await handleSaveReceiptPhoto(actionEl.getAttribute('data-id')); return; }
    if(action === 'generate-receipt'){ handleGenerateReceipt(actionEl.getAttribute('data-id')); return; }
    if(action === 'toggle-extra'){ actionEl.classList.toggle('active'); return; }
    if(action === 'filter-requests'){ requestsFilter = actionEl.getAttribute('data-value'); render(); return; }
    if(action === 'decide-request'){ openDecisionSheet(actionEl.getAttribute('data-id'), actionEl.getAttribute('data-decision')); return; }
    if(action === 'withdraw-request'){ if(confirm('Withdraw this request?')) await handleWithdrawRequest(actionEl.getAttribute('data-id')); return; }
    if(action === 'delete-agreement'){ await handleDeleteAgreement(actionEl.getAttribute('data-id')); return; }
    if(action === 'generate-agreement-doc'){ await handleGenerateAgreementDoc(actionEl.getAttribute('data-id')); return; }
    if(action === 'download-blank-agreement'){ await handleDownloadBlankAgreement(); return; }
    if(action === 'print-agreement'){ handlePrintAgreement(); return; }
    if(action === 'download-filled-agreement'){ await handleDownloadFilledAgreement(); return; }
    if(action === 'export-data'){ await handleExportData(); return; }
    if(action === 'disconnect-sync'){ if(SYNC_MODE === 'supabase') await handleSignOut(); else await handleDisconnectSync(); return; }
    if(action === 'create-invite'){ await handleCreateInvite(); return; }
    if(action === 'show-team'){ await openTeamSheet(); return; }
    if(action === 'remove-member'){ await handleRemoveMember(actionEl.getAttribute('data-id')); return; }
    if(action === 'copy-invite'){ const el = document.getElementById('inviteLink'); await copyText(el ? el.value : ''); toast('Invite link copied'); return; }
    if(action === 'share-invite'){ const el = document.getElementById('inviteLink'); try{ await navigator.share({ title: 'BriidgeITFarm invite', text: 'Join the farm on BriidgeITFarm:', url: el.value }); }catch(e){} return; }
    return;
  }
  if(e.target.id === 'sheetOverlay'){ closeSheet(); return; }
});

document.addEventListener('submit', async (e) => {

/* ============================== HANDLERS ============================== */
function getFileFromField(fieldId){
  const field = document.getElementById(fieldId);
  if(!field) return null;
  return field._file || null;
}

async function copyText(text){
  try{ await navigator.clipboard.writeText(text); return true; }catch(e){}
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  ta.remove();
  return true;
}

async function handleToggleSpecies(key){
  if(!isOwner()){ toast('Only the owner can change this'); return; }
  if(!SPECIES[key] || !db) return;
  let list = enabledSpecies().slice();
  if(list.includes(key)){
    if(list.length === 1){ toast('Keep at least one kind of animal'); return; }
    list = list.filter(k => k !== key);
  } else list.push(key);
  try{
    await db.doc('farm/settings').update({ species: list });
    await loadAll();
    render();
  }catch(err){ console.error(err); toast('Could not save'); }
}

async function handleAddPig(form){
  const file = getFileFromField('pigPhotoField');
  if(!file){ toast('A photo is required to add ' + (vocab().one ? 'a ' : 'an ') + vocab().a); return; }
  const fd = new FormData(form);
  const sexEl = document.querySelector('#sexRow .selected');
  const sourceEl = document.querySelector('#sourceRow .selected');
  const boughtStageEl = document.querySelector('#boughtStageRow .selected');

  const spEl = document.querySelector('#speciesRow .selected');
  toast('Saving ' + vocab().a + '…');
  const upload = await uploadPhoto(file);
  if(!upload) return;

  const pig = {
    species: spEl ? spEl.dataset.value : enabledSpecies()[0],
    name: fd.get('name').trim(),
    tag: fd.get('tag').trim(),
    breed: fd.get('breed').trim(),
    sex: sexEl ? sexEl.dataset.value : 'unknown',
    source: sourceEl ? sourceEl.dataset.value : 'born',
    status: 'active',
    notes: fd.get('notes').trim(),
    photoId: upload.id,
    photoUrl: upload.url,
    photos: [{ id: upload.id, url: upload.url, date: todayISO() }],
    createdAt: new Date().toISOString()
  };
  if(pig.source === 'born'){
    pig.birthDate = fd.get('birthDate') || todayISO();
    pig.motherId = fd.get('motherId') || null;
    pig.fatherId = fd.get('fatherId') || null;
  } else {
    pig.acquiredDate = fd.get('acquiredDate') || todayISO();
    pig.boughtStage = boughtStageEl ? boughtStageEl.dataset.value : 'adult';
    pig.purchasePrice = parseFloat(fd.get('purchasePrice')) || 0;
    pig.supplierId = fd.get('supplierId') || null;
  }

  if(!db){ toast('Storage unavailable — ' + vocab().a + ' not saved'); return; }
  try{
    const ref = await db.collection('pigs').add(pig);

    if(pig.source === 'bought' && pig.purchasePrice > 0){
      let receipt = null;
      const receiptFile = getFileFromField('purchaseReceiptField');
      if(receiptFile) receipt = await uploadPhoto(receiptFile);
      try{
        await db.collection('transactions').add({
          type:'expense', category:'purchase', amount: pig.purchasePrice, date: pig.acquiredDate,
          note: 'Purchase of ' + pig.name, supplierId: pig.supplierId || null, pigId: ref.id,
          receiptId: receipt ? receipt.id : null, receiptUrl: receipt ? receipt.url : null,
          createdAt: new Date().toISOString()
        });
      }catch(err){ console.error(err); }
    }

    await loadAll();
    location.hash = '#/pigs/' + ref.id;
    toast(vocab().A + ' added to the farm ' + SPECIES[pig.species].emoji);
  }catch(err){ console.error(err); toast('Could not save ' + vocab().a); }
}

async function handleEditPig(form){
  const id = form.dataset.id;
  const fd = new FormData(form);
  const file = getFileFromField('pigPhotoField');
  const updates = {
    name: fd.get('name').trim(),
    tag: fd.get('tag').trim(),
    breed: fd.get('breed').trim(),
    status: fd.get('status'),
    notes: fd.get('notes').trim()
  };
  if(fd.get('species') && SPECIES[fd.get('species')]) updates.species = fd.get('species');
  if(file){
    toast('Saving photo…');
    const upload = await uploadPhoto(file);
    if(upload){
      updates.photoId = upload.id;
      updates.photoUrl = upload.url;
      const pig = pigById(id);
      const photos = (pig && pig.photos) ? [...pig.photos] : [];
      photos.push({ id: upload.id, url: upload.url, date: todayISO() });
      updates.photos = photos;
    }
  }
  if(!db){ toast('Storage unavailable'); return; }
  try{
    await db.doc('pigs/' + id).update(updates);
    await loadAll();
    location.hash = '#/pigs/' + id;
    toast('Saved');
  }catch(err){ console.error(err); toast('Could not save changes'); }
}

async function handleDeletePig(id){
  if(!confirm('Remove this ' + vocab().a + "'s record? This cannot be undone.")) return;
  if(!db) return;
  try{
    await db.doc('pigs/' + id).delete();
    await loadAll();
    location.hash = '#/pigs';
    toast(vocab().A + ' record removed');
  }catch(err){ console.error(err); toast('Could not remove ' + vocab().a); }
}

async function handleAddPigPhoto(pigId, file){
  toast('Uploading photo…');
  const upload = await uploadPhoto(file);
  if(!upload || !db) return;
  const pig = pigById(pigId);
  const photos = (pig && pig.photos) ? [...pig.photos] : [];
  photos.push({ id: upload.id, url: upload.url, date: todayISO() });
  try{
    await db.doc('pigs/' + pigId).update({ photos });
    await loadAll();
    render();
    toast('Photo added');
  }catch(err){ console.error(err); toast('Could not add photo'); }
}

async function handleSetProfilePhoto(pigId, photoId){
  const pig = pigById(pigId);
  const photoEntry = (pig.photos||[]).find(p => p.id === photoId);
  if(!db || !photoEntry) return;
  try{
    await db.doc('pigs/' + pigId).update({ photoId: photoEntry.id, photoUrl: photoEntry.url || null });
    await loadAll();
    render();
    toast('Profile photo updated');
  }catch(err){ console.error(err); toast('Could not update profile photo'); }
}

async function handleMarkSold(form){
  const id = form.dataset.id;
  const fd = new FormData(form);
  const saleDate = fd.get('saleDate') || todayISO();
  const salePrice = parseFloat(fd.get('salePrice')) || 0;
  const saleBuyer = fd.get('saleBuyer').trim();
  if(!db) return;
  try{
    await db.doc('pigs/' + id).update({ status:'sold', saleDate, salePrice, saleBuyer });
    await db.collection('transactions').add({
      type:'income', category:'sale', amount: salePrice, date: saleDate,
      note: 'Sale of ' + pigName(id) + (saleBuyer ? ' to ' + saleBuyer : ''), pigId: id,
      createdAt: new Date().toISOString()
    });
    closeSheet();
    await loadAll();
    render();
    toast('Sale recorded');
  }catch(err){ console.error(err); toast('Could not record sale'); }
}

async function handleRecordBirth(form){
  const file = getFileFromField('litterPhotoField');
  if(!file){ toast('Please add a newborn photo'); return; }
  const fd = new FormData(form);
  const motherId = fd.get('motherId');
  if(!motherId){ toast('Select the mother'); return; }
  const litterSize = parseInt(fd.get('litterSize'), 10) || 1;
  const date = fd.get('date') || todayISO();
  const fatherId = fd.get('fatherId') || null;
  const notes = fd.get('notes').trim();

  toast('Saving litter…');
  const upload = await uploadPhoto(file);
  if(!upload || !db) return;

  const mother = pigById(motherId);
  const pigletIds = [];
  try{
    for(let i=1;i<=litterSize;i++){
      const youngWord = SPECIES[mother ? speciesOf(mother) : enabledSpecies()[0]].young;
      const piglet = {
        species: mother ? speciesOf(mother) : enabledSpecies()[0],
        name: (mother ? mother.name + "'s " + youngWord.toLowerCase() + ' ' : youngWord + ' ') + i,
        tag: '', breed: mother ? mother.breed || '' : '',
        sex: 'unknown', source:'born', status:'active',
        birthDate: date, motherId: motherId, fatherId: fatherId,
        photoId: upload.id, photoUrl: upload.url,
        photos: [{ id: upload.id, url: upload.url, date }],
        notes: '', createdAt: new Date().toISOString()
      };
      const ref = await db.collection('pigs').add(piglet);
      pigletIds.push(ref.id);
    }
    await db.collection('births').add({ date, motherId, fatherId, litterSize, pigletIds, notes, photoId: upload.id, photoUrl: upload.url, createdAt: new Date().toISOString() });
    await loadAll();
    location.hash = '#/pigs';
    const ySp = SPECIES[mother ? speciesOf(mother) : enabledSpecies()[0]];
    toast(litterSize + ' ' + (litterSize===1 ? ySp.young : ySp.youngPl).toLowerCase() + ' added ' + ySp.emoji);
  }catch(err){ console.error(err); toast('Could not save birth record'); }
}

async function handleAddTransaction(form){
  const fd = new FormData(form);
  const typeEl = document.querySelector('#typeRow .selected');
  const file = getFileFromField('receiptField');
  const type = typeEl ? typeEl.dataset.value : 'expense';
  const amount = parseFloat(fd.get('amount')) || 0;
  if(amount <= 0){ toast('Enter an amount'); return; }

  toast('Saving…');

    note: fd.get('note').trim(), receiptId: receipt ? receipt.id : null, receiptUrl: receipt ? receipt.url : null,
    createdAt: new Date().toISOString()
  };
  if(!db){ toast('Storage unavailable'); return; }
  try{
    await db.collection('transactions').add(txn);
    await loadAll();
    location.hash = '#/money';
    toast('Transaction saved');
  }catch(err){ console.error(err); toast('Could not save transaction'); }
}

/* ============================== BACKUP / TRANSFER ============================== */
function blobToDataURL(blob){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

async function handleExportData(){
  try{
    const database = await openIDB();
    const docsStore = database.transaction('docs', 'readonly').objectStore('docs');
    const docs = await reqToPromise(docsStore.getAll());
    const assetsStore = database.transaction('assets', 'readonly').objectStore('assets');
    const assets = await reqToPromise(assetsStore.getAll());
    const assetsEncoded = await Promise.all(assets.map(async a => ({ id: a.id, type: a.type, data: await blobToDataURL(a.blob) })));
    const payload = { app: 'BriidgeITFarm', exportedAt: new Date().toISOString(), docs, assets: assetsEncoded };
    const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
    await downloadBlob('bridgeitfarm-backup-' + todayISO() + '.json', blob);
  }catch(err){ console.error(err); toast('Could not export your data'); }
}

async function handleImportDataFile(file){
  if(!confirm('This adds the backup\u2019s records to what you already have here (nothing already saved is removed). Continue?')) return;
  try{
    const text = await file.text();
    const payload = JSON.parse(text);
    const database = await openIDB();
    const docsStore = database.transaction('docs', 'readwrite').objectStore('docs');
    for(const row of (payload.docs || [])){ await reqToPromise(docsStore.put(row)); }
    const assetsStore = database.transaction('assets', 'readwrite').objectStore('assets');
    for(const a of (payload.assets || [])){
      const blob = await (await fetch(a.data)).blob();
      await reqToPromise(assetsStore.put({ id: a.id, blob, type: a.type }));
    }
    await loadAll();
    await resolveAllAssetURLs();
    render();
    toast('Backup imported');
  }catch(err){ console.error(err); toast('Could not read that backup file'); }
}

async function handleSaveSettings(form){
