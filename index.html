<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BriidgeITFarm</title>
<meta name="description" content="Track your animals, births, feed, health, and money for your farm — works offline, installable on your phone.">
<meta name="theme-color" content="#332A1F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BriidgeITFarm">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<!-- Only used if the person connects Cloud sync in Settings — safe to load even if unused. -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<style>
  :root{
    --bg:#EFEADB; --bg-soft:#E4DCC5; --card:#FBF7EC; --ink:#2B241C; --ink-soft:#6B5F4E;
    --line:rgba(43,36,28,0.14); --brick:#A8442E; --brick-dark:#7E3020; --pasture:#4F6F52;
    --pasture-dark:#37502F; --rose:#C97B72; --wheat:#D9A83E; --danger:#A8442E;
    --charcoal:#332A1F; --charcoal-dark:#241C13; --shadow:0 1px 2px rgba(43,36,28,0.07), 0 1px 1px rgba(43,36,28,0.04);
    --radius-card:14px; --radius-pill:999px;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark){
      --bg:#211C15; --bg-soft:#2A2319; --card:#2C2519; --ink:#F1E9D8; --ink-soft:#BBA98A;
      --line:rgba(241,233,216,0.14); --card-shadow: none;
    }
  }
  :root[data-theme="dark"]{
    --bg:#211C15; --bg-soft:#2A2319; --card:#2C2519; --ink:#F1E9D8; --ink-soft:#BBA98A;
    --line:rgba(241,233,216,0.14);
  }
  html{ scroll-padding-top:env(safe-area-inset-top,0px); }
  html,body{ height:100%; }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Work Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; justify-content:center;
  }
  .app-shell{
    width:100%; max-width:520px; min-height:100%;
    display:flex; flex-direction:column; position:relative;
    background:var(--bg);
  }
  h1,h2,h3,.display{ font-family:'Fraunces', Georgia, serif; font-weight:600; letter-spacing:-0.01em; margin:0; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; }

  /* ---------- header ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:calc(env(safe-area-inset-top,0px) + 18px) 18px 14px;
    background:var(--charcoal); color:#F3ECDD;
    border-bottom:3px solid var(--brick);
  }
  .brand{ display:flex; align-items:center; gap:12px; min-width:0; }
  .brand-tile{ flex:none; width:54px; height:38px; background:#F6F0E4; border:2px solid #E3D3AB; border-radius:11px; display:flex; align-items:center; justify-content:center; }
  .brand-tile img{ width:40px; height:auto; display:block; }
  .auth-logo{ display:block; width:150px; max-width:60%; margin:0 auto 14px; }
  .topbar .farm-name{ font-size:1.4rem; line-height:1.1; }
  .topbar .farm-sub{ font-size:0.7rem; text-transform:uppercase; letter-spacing:0.08em; opacity:0.72; margin-top:3px; }
  .gear-btn{
    background:rgba(251,243,228,0.14); border:1px solid rgba(251,243,228,0.35);
    color:#FBF3E4; width:40px; height:40px; border-radius:var(--radius-pill);
    display:flex; align-items:center; justify-content:center; font-size:1.15rem; cursor:pointer;
    flex-shrink:0;
  }

  /* ---------- main ---------- */
  main{ flex:1; padding:16px 16px 96px; overflow-x:hidden; }
  .section-title{ font-size:1.05rem; margin:22px 0 10px; display:flex; align-items:center; justify-content:space-between; }
  .section-title .see-all{ font-size:0.78rem; color:var(--brick); font-weight:600; }
  .muted{ color:var(--ink-soft); }
  .empty-state{
    border:1px dashed var(--line); border-radius:var(--radius-card); padding:26px 18px;
    text-align:center; color:var(--ink-soft); font-size:0.9rem;
  }
  .empty-state .display{ color:var(--ink); font-size:1.1rem; margin-bottom:6px; }

  /* ---------- stat grid ---------- */
  .stat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .stat-card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius-card);
    padding:12px 10px; text-align:left; box-shadow:var(--shadow);
  }
  .stat-card .num{ font-family:'Fraunces',serif; font-size:1.7rem; line-height:1; font-weight:600; }
  .stat-card .lbl{ font-size:0.68rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); margin-top:4px; }
  .stat-card.wide{ grid-column:span 3; display:flex; align-items:center; justify-content:space-between; }
  .stat-card.tone-pasture .num{ color:var(--pasture-dark); }
  .stat-card.tone-brick .num{ color:var(--brick); }
  .stat-card.tone-wheat .num{ color:#8a6a12; }

  /* ---------- photo strip ---------- */
  .photo-strip{ display:flex; gap:10px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none; }
  .photo-strip::-webkit-scrollbar{ display:none; }
  .photo-strip .ph{
    flex:0 0 auto; width:104px; height:104px; border-radius:12px; overflow:hidden;
    background:var(--bg-soft); border:1px solid var(--line); position:relative;
  }
  .photo-strip .ph img{ width:100%; height:100%; object-fit:cover; display:block; }
  .photo-strip .ph .cap{
    position:absolute; bottom:0; left:0; right:0; background:linear-gradient(transparent,rgba(0,0,0,0.55));
    color:#fff; font-size:0.62rem; padding:4px 6px; font-weight:600;
  }

  /* ---------- pig grid ---------- */
  .pig-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  .pig-card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius-card);
    overflow:hidden; display:flex; flex-direction:column; cursor:pointer; box-shadow:var(--shadow);
  }
  .pig-card .thumb{ width:100%; aspect-ratio:1/1; background:var(--bg-soft); overflow:hidden; }
  .pig-card .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .pig-card .thumb .ph-fallback{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:2rem; opacity:0.35; }
  .pig-card .info{ padding:9px 10px 11px; }
  .pig-card .pname{ font-family:'Fraunces',serif; font-weight:600; font-size:1rem; }
  .pig-card .ptag{ font-size:0.74rem; color:var(--ink-soft); margin-top:1px; }
  .badge{
    display:inline-block; font-size:0.62rem; text-transform:uppercase; letter-spacing:0.05em;
    padding:2px 7px; border-radius:var(--radius-pill); font-weight:700; margin-top:6px;
  }
  .badge.piglet{ background:#EADFC0; color:#7A5A12; }
  .badge.adult{ background:#DDE7DA; color:var(--pasture-dark); }
  .badge.sold{ background:#EAD3CE; color:var(--brick-dark); }
  .badge.deceased{ background:#E2DCD3; color:var(--ink-soft); }
  .badge.pending{ background:#F1E2B4; color:#7A5A12; }
  .badge.approved{ background:#DDE7DA; color:var(--pasture-dark); }
  .badge.declined{ background:#EAD3CE; color:var(--brick-dark); }

  /* ---------- filter chips ---------- */
  .chip-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:14px; scrollbar-width:none; }
  .chip-row::-webkit-scrollbar{ display:none; }
  .chip{
    flex:0 0 auto; border:1px solid var(--line); background:var(--card); color:var(--ink-soft);
    padding:7px 14px; border-radius:var(--radius-pill); font-size:0.8rem; font-weight:600; cursor:pointer;
  }
  .chip.active{ background:var(--brick); border-color:var(--brick); color:#fff; }
  .search-row{ display:flex; gap:8px; margin-bottom:12px; }
  .search-row input{ flex:1; }

  /* ---------- forms ---------- */
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:0.78rem; font-weight:600; color:var(--ink-soft); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.04em; }
  input[type=text], input[type=email], input[type=password], input[type=number], input[type=date], input[type=tel], select, textarea{
    width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--line);
    background:var(--card); color:var(--ink); font-size:0.95rem; font-family:inherit;
  }
  textarea{ min-height:76px; resize:vertical; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .radio-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .radio-opt{
    border:1px solid var(--line); background:var(--card); padding:8px 14px; border-radius:var(--radius-pill);
    font-size:0.85rem; cursor:pointer; font-weight:600; color:var(--ink-soft);
  }
  .radio-opt.selected{ background:var(--pasture); border-color:var(--pasture); color:#fff; }
  .photo-upload{
    border:2px dashed var(--line); border-radius:14px; padding:18px; text-align:center;
    color:var(--ink-soft); cursor:pointer; position:relative; overflow:hidden; min-height:140px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  }
  .photo-upload img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .photo-upload .hint{ font-size:0.8rem; position:relative; z-index:1; }
  .photo-upload.has-img .hint{ background:rgba(0,0,0,0.55); color:#fff; padding:4px 10px; border-radius:var(--radius-pill); }
  .photo-upload input[type=file]{ display:none; }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding:12px 18px; border-radius:var(--radius-pill); border:none; font-weight:700;
    font-size:0.92rem; cursor:pointer; width:100%;
  }
  .btn-primary{ background:var(--brick); color:#FBF3E4; }
  .btn-secondary{ background:var(--card); color:var(--ink); border:1px solid var(--line); }
  .btn-pasture{ background:var(--pasture); color:#fff; }
  .btn-ghost{ background:transparent; color:var(--brick); font-weight:700; }
  .btn-sm{ width:auto; padding:8px 14px; font-size:0.8rem; }
  .btn-danger{ background:transparent; color:var(--danger); border:1px solid var(--danger); }
  .btn-row{ display:flex; gap:10px; margin-top:18px; }
  .btn-row .btn{ width:auto; flex:1; }

  /* ---------- page header w/ back ---------- */
  .page-head{ display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .back-btn{
    width:36px; height:36px; border-radius:var(--radius-pill); border:1px solid var(--line);
    background:var(--card); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
  }
  .page-head h2{ font-size:1.25rem; }

  /* ---------- pig detail ---------- */
  .hero-photo{
    width:100%; aspect-ratio:4/3; border-radius:16px; overflow:hidden; background:var(--bg-soft);
    border:1px solid var(--line); margin-bottom:14px; position:relative;
  }
  .hero-photo img{ width:100%; height:100%; object-fit:cover; display:block; }
  .hero-photo .ph-fallback{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:3.4rem; opacity:0.3; }
  .detail-title{ font-size:1.6rem; margin-bottom:2px; }
  .detail-sub{ color:var(--ink-soft); font-size:0.88rem; margin-bottom:14px; }
  .info-card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius-card); padding:14px 16px; margin-bottom:12px; box-shadow:var(--shadow); }
  .info-row{ display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--line); font-size:0.88rem; }
  .info-row:last-child{ border-bottom:none; }
  .info-row .k{ color:var(--ink-soft); }
  .info-row .v{ font-weight:600; text-align:right; }
  .family-row{ display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line); }
  .family-row:last-child{ border-bottom:none; }
  .family-pig{ display:flex; align-items:center; gap:10px; }
  .family-pig .mini-thumb{ width:38px; height:38px; border-radius:10px; overflow:hidden; background:var(--bg-soft); flex-shrink:0; }
  .family-pig .mini-thumb img{ width:100%; height:100%; object-fit:cover; }
  .children-grid{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; }
  .child-chip{
    flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:5px; width:64px; cursor:pointer;
  }
  .child-chip .mini-thumb{ width:56px; height:56px; border-radius:12px; overflow:hidden; background:var(--bg-soft); }
  .child-chip .mini-thumb img{ width:100%; height:100%; object-fit:cover; }
  .child-chip span{ font-size:0.68rem; text-align:center; color:var(--ink-soft); }
  /* ---------- family tree diagram ---------- */
  .tree-scroll{ overflow-x:auto; padding:4px 2px 2px; }
  .tree{ display:flex; flex-direction:column; align-items:center; min-width:max-content; margin:0 auto; }
  .tree-stem{ width:1px; height:16px; background:var(--line); }
  .tree-tier{ display:flex; gap:16px; justify-content:center; }
  .tree-tier.grandparents{ gap:6px; }
  .tree-spacer{ width:20px; }
  .tree-branch{ display:flex; flex-direction:column; align-items:center; width:100%; }
  .tree-hline{ height:1px; background:var(--line); align-self:stretch; margin:0 44px; }
  .tree-nodes{ display:flex; gap:16px; justify-content:center; }
  .tree-leaf{ display:flex; flex-direction:column; align-items:center; }
  .tree-vline{ width:1px; height:12px; background:var(--line); }
  .tree-node{ display:flex; flex-direction:column; align-items:center; gap:4px; width:64px; cursor:pointer; text-align:center; }
  .tree-node.current{ cursor:default; }
  .tree-thumb{
    width:52px; height:52px; border-radius:14px; overflow:hidden; background:var(--bg-soft);
    display:flex; align-items:center; justify-content:center; font-size:1.3rem;
    border:2px solid transparent;
  }
  .tree-node.current .tree-thumb{ border-color:var(--brick); box-shadow:0 0 0 3px rgba(168,68,46,0.14); }
  .tree-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .tree-name{ font-size:0.68rem; font-weight:600; line-height:1.15; }
  .tree-role{ font-size:0.58rem; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.04em; }
  .tree-node.placeholder .tree-thumb{ opacity:0.4; }
  .tree-node.placeholder .tree-name{ color:var(--ink-soft); }

  .gallery-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .gallery-grid .g-item{ aspect-ratio:1/1; border-radius:10px; overflow:hidden; background:var(--bg-soft); position:relative; }
  .gallery-grid .g-item img{ width:100%; height:100%; object-fit:cover; }
  .gallery-grid .g-item .set-btn{
    position:absolute; bottom:4px; right:4px; font-size:0.6rem; background:rgba(0,0,0,0.6); color:#fff;
    padding:3px 6px; border-radius:6px; border:none; cursor:pointer;
  }
  .txn-row{ display:flex; justify-content:space-between; align-items:flex-start; padding:11px 0; border-bottom:1px solid var(--line); gap:10px; }
  .txn-row:last-child{ border-bottom:none; }
  .txn-cat{ font-weight:600; font-size:0.9rem; }
  .txn-note{ color:var(--ink-soft); font-size:0.78rem; margin-top:1px; }
  .txn-amt{ font-weight:700; font-size:0.92rem; white-space:nowrap; }
  .txn-amt.income{ color:var(--pasture-dark); }
  .txn-amt.expense{ color:var(--brick); }
  .log-icon{
    width:30px; height:30px; border-radius:var(--radius-pill); background:var(--bg-soft);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:0.95rem;
  }
  .txn-left{ display:flex; gap:10px; align-items:flex-start; }

  /* ---------- money summary ---------- */
  .money-summary{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
  .money-summary .m-card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius-card); padding:12px 14px; box-shadow:var(--shadow); }
  .money-summary .m-card .num{ font-family:'Fraunces',serif; font-size:1.4rem; font-weight:600; }
  .money-summary .m-card.in .num{ color:var(--pasture-dark); }
  .money-summary .m-card.out .num{ color:var(--brick); }
  .money-summary .m-card .lbl{ font-size:0.7rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); margin-top:2px; }

  /* ---------- charts ---------- */
  .chart-card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius-card); padding:16px 14px 10px; margin-bottom:16px; box-shadow:var(--shadow); }
  .chart-card h3{ font-size:0.95rem; margin-bottom:10px; }
  .chart-card canvas{ max-height:220px; }

  /* ---------- suppliers / settings ---------- */
  .list-row{ display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--line); }
  .list-row:last-child{ border-bottom:none; }
  .list-row .name{ font-weight:600; font-size:0.92rem; }
  .list-row .sub{ font-size:0.76rem; color:var(--ink-soft); }

  /* ---------- bottom nav ---------- */
  .bottom-nav{
    position:fixed; left:50%; transform:translateX(-50%); bottom:0; width:100%; max-width:520px;
    background:var(--card); border-top:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-around;
    padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));
    z-index:40;
  }
  .nav-item{
    display:flex; flex-direction:column; align-items:center; gap:2px; background:none; border:none;
    color:var(--ink-soft); font-size:0.63rem; font-weight:600; cursor:pointer; padding:4px 6px; width:56px;
  }
  .nav-item .ic{ font-size:1.15rem; }
  .nav-item.active{ color:var(--brick); }
  .nav-item.add-item{ margin-top:-22px; }
  .nav-item.add-item .ic{
    width:48px; height:48px; border-radius:var(--radius-pill); background:var(--brick); color:#FBF3E4;
    display:flex; align-items:center; justify-content:center; font-size:1.5rem; box-shadow:0 4px 10px rgba(0,0,0,0.22);
  }

  /* ---------- action sheet ---------- */
  /* ---------- fillable paper agreement ---------- */
  .fill-actions{ display:flex; gap:10px; margin-bottom:14px; }
  .fill-actions .btn{ width:auto; flex:1; }
  .paper-doc{
    background:#FBF7EC; color:#2B241C; border:1px solid var(--line); border-radius:12px;
    padding:22px 18px 28px; font-family:Georgia,'Times New Roman',serif; line-height:1.6; margin-bottom:24px;
  }
  .paper-doc h1{ font-size:1.3rem; text-align:center; margin-bottom:2px; font-family:inherit; }
  .paper-doc .sub{ text-align:center; color:#6B5F4E; font-size:0.82rem; margin-bottom:18px; }
  .paper-doc h2{ color:#A8442E; border-bottom:2px solid #A8442E; padding-bottom:4px; font-size:0.98rem; margin:20px 0 8px; font-family:inherit; }
  .paper-doc .row{ margin:9px 0; font-size:0.88rem; }
  .paper-doc .row .k{ color:#6B5F4E; display:inline-block; min-width:120px; }
  .paper-doc p, .paper-doc li{ font-size:0.88rem; }
  .paper-doc ul{ padding-left:18px; }
  .paper-doc li{ margin-bottom:6px; }
  .paper-doc label{ font-size:0.86rem; }
  .paper-doc input[type=text], .paper-doc input[type=date]{
    border:none; border-bottom:1px solid #2B241C; background:transparent; font-family:inherit;
    font-size:0.88rem; padding:2px 3px; color:#2B241C;
  }
  .paper-doc input[type=radio], .paper-doc input[type=checkbox]{ accent-color:#A8442E; margin-right:3px; }
  .paper-doc table{ border-collapse:collapse; width:100%; margin-top:8px; font-size:0.78rem; }
  .paper-doc td, .paper-doc th{ border:1px solid #D8CFBA; padding:6px 7px; vertical-align:top; }
  .paper-doc th{ background:#A8442E; color:#fff; }
  .paper-doc .sig{ margin-top:14px; font-size:0.88rem; }

  /* ---- in-app camera ---- */
  body.camera-open{ overflow:hidden; }
  .camera-overlay{ position:fixed; inset:0; z-index:100; background:#000; display:flex; flex-direction:column; color:#fff; }
  .cam-top{ display:flex; align-items:center; justify-content:space-between; padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px; }
  .cam-title{ font-weight:600; font-size:0.95rem; }
  .cam-btn{ width:44px; height:44px; border-radius:50%; border:none; background:rgba(255,255,255,0.16); color:#fff; font-size:1.1rem; cursor:pointer; }
  .cam-stage{ flex:1; position:relative; min-height:0; background:#111; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .cam-video, .cam-preview{ width:100%; height:100%; object-fit:contain; background:#000; }

<script>
/* ============================== LOCAL STORAGE LAYER ==============================
   Standalone build: everything lives in this browser's IndexedDB. No server,
   no account — each device/browser has its own data. Use Settings → Export/Import
   (see bottom of this file) to move data between devices. */
let idbPromise = null;
function openIDB(){
  if(idbPromise) return idbPromise;
  idbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open('bridgeitfarm', 1);
    req.onupgradeneeded = () => {
      const database = req.result;
      if(!database.objectStoreNames.contains('docs')) database.createObjectStore('docs', { keyPath: 'path' });
      if(!database.objectStoreNames.contains('assets')) database.createObjectStore('assets', { keyPath: 'id' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return idbPromise;
}
function idbTx(storeName, mode){
  return openIDB().then(database => database.transaction(storeName, mode).objectStore(storeName));
}
function reqToPromise(req){
  return new Promise((resolve, reject) => { req.onsuccess = () => resolve(req.result); req.onerror = () => reject(req.error); });
}
async function localDocGet(path){
  const store = await idbTx('docs', 'readonly');
  const row = await reqToPromise(store.get(path));
  return row ? row.data : null;
}
async function localDocSet(path, data){
  const store = await idbTx('docs', 'readwrite');
  await reqToPromise(store.put({ path, data }));
}
async function localDocDelete(path){
  const store = await idbTx('docs', 'readwrite');
  await reqToPromise(store.delete(path));
}
async function localCollectionGet(prefix){
  const store = await idbTx('docs', 'readonly');
  const all = await reqToPromise(store.getAll());
  const p = prefix.endsWith('/') ? prefix : prefix + '/';
  return all.filter(r => r.path.startsWith(p) && !r.path.slice(p.length).includes('/'))
            .map(r => ({ id: r.path.slice(p.length), data: r.data }));
}

function makeLocalDB(){
  return {
    doc(path){
      return {
        get: async () => { const data = await localDocGet(path); return { exists: !!data, data: () => data }; },
        set: async (data) => { await localDocSet(path, data); },
        update: async (partial) => { const cur = (await localDocGet(path)) || {}; await localDocSet(path, Object.assign({}, cur, partial)); },
        delete: async () => { await localDocDelete(path); }
      };
    },
    collection(path){
      return {
        get: async () => { const items = await localCollectionGet(path); return { docs: items.map(it => ({ id: it.id, data: () => it.data })) }; },
        add: async (data) => { const id = uid(); await localDocSet(path + '/' + id, data); return { id }; }
      };
    }
  };
}

const ASSET_URL_CACHE = {};
async function assetBlobURL(id){
  if(!id) return '';
  if(ASSET_URL_CACHE[id]) return ASSET_URL_CACHE[id];
  const store = await idbTx('assets', 'readonly');
  const row = await reqToPromise(store.get(id));
  if(!row) return '';
  const url = URL.createObjectURL(row.blob);
  ASSET_URL_CACHE[id] = url;
  return url;
}
async function getLocalAssetRow(id){
  const store = await idbTx('assets', 'readonly');
  return await reqToPromise(store.get(id));
}
function makeLocalAssets(){
  return {
    upload: async (file) => {
      const id = uid();
      const store = await idbTx('assets', 'readwrite');
      await reqToPromise(store.put({ id, blob: file, type: file.type }));
      const url = URL.createObjectURL(file);
      ASSET_URL_CACHE[id] = url;
      return { id, url };
    }
  };
}

/* ============================== LIVE CLOUD SYNC ==============================
   Off by default (this phone only). In Settings the owner can connect EITHER
     • Firebase (Firestore + Storage), or
     • Supabase (Postgres + Storage + Realtime)
   plus a "sync code". Every phone that uses the same project + code sees the same farm,
   and changes (including photos) appear on the other phone within a second or two.
   db / assetsApi are swapped for cloud versions with the same small API. */
let SYNC_MODE = 'local';        // 'local' | 'firebase' | 'supabase'
let SYNC_CODE = '';
let SYNC_STATUS = 'local';      // 'local' | 'connecting' | 'live' | 'offline' | 'error'
let SYNC_ROLE = '';             // Supabase login role: 'owner' | 'worker' ('' otherwise)
let SYNC_EMAIL = '';
function isOwner(){ return SYNC_MODE !== 'supabase' || SYNC_ROLE === 'owner'; }
function applyRole(){ document.body.classList.toggle('role-worker', SYNC_MODE === 'supabase' && SYNC_ROLE === 'worker'); }
let SYNC_LAST = 0;              // time of the last change received from another phone
let firebaseApp = null;
let supabaseClient = null;
let syncTeardown = [];          // functions that stop listeners when disconnecting

const SYNC_COLLECTIONS = ['pigs', 'transactions', 'births', 'suppliers', 'farmPhotos', 'agreements', 'requests'];
const SUPABASE_JS_URL = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';

function syncConfigKey(){ return 'bridgeitfarm_sync_config'; }
function loadSyncConfig(){
  try{
    const cfg = JSON.parse(localStorage.getItem(syncConfigKey()) || 'null');
    if(cfg && !cfg.provider && cfg.firebaseConfig) cfg.provider = 'firebase';   // older saved setups
    return cfg;
  }catch(e){ return null; }
}
function saveSyncConfigLocal(cfg){ try{ localStorage.setItem(syncConfigKey(), JSON.stringify(cfg)); }catch(e){} }
function clearSyncConfigLocal(){ try{ localStorage.removeItem(syncConfigKey()); }catch(e){} }

function setSyncStatus(s){
  SYNC_STATUS = s;
  const el = document.getElementById('syncPill');
  if(el) paintSyncPill(el);
  const line = document.getElementById('syncStatusLine');
  if(line) line.textContent = syncStatusText();
}
function syncStatusText(){
  if(SYNC_MODE === 'local') return 'Not connected — data stays on this phone only.';
  const where = SYNC_MODE === 'supabase' ? 'Supabase' : 'Firebase';
  if(SYNC_STATUS === 'live') return 'Live with ' + where + ' · code “' + SYNC_CODE + '”' + (SYNC_LAST ? ' · last update from another phone at ' + new Date(SYNC_LAST).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'}) : '');
  if(SYNC_STATUS === 'connecting') return 'Connecting to ' + where + '…';
  if(SYNC_STATUS === 'offline') return 'Offline — will catch up automatically when the internet is back.';
  return 'Could not reach ' + where + ' — check Settings.';
}
function paintSyncPill(el){
  if(SYNC_MODE === 'local'){ el.style.display = 'none'; return; }
  el.style.display = 'inline-flex';
  el.className = 'sync-pill ' + SYNC_STATUS;
  el.textContent = SYNC_STATUS === 'live' ? 'Live' : SYNC_STATUS === 'connecting' ? 'Connecting…' : SYNC_STATUS === 'offline' ? 'Offline' : 'Sync problem';
}

/* ---------- Firebase ---------- */
function makeFirebaseDB(app, code){
  const fs = app.firestore();
  const root = 'rooms/' + code + '/';
  return {
    doc(path){
      const ref = fs.doc(root + path);
      return {
        get: async () => { const snap = await ref.get(); return { exists: snap.exists, data: () => snap.data() }; },
        set: async (data) => { await ref.set(data); },
        update: async (partial) => { await ref.set(partial, { merge: true }); },
        delete: async () => { await ref.delete(); }
      };
    },
    collection(path){
      const ref = fs.collection(root + path);
      return {
        get: async () => { const snap = await ref.get(); return { docs: snap.docs.map(d => ({ id: d.id, data: () => d.data() })) }; },
        add: async (data) => { const r = await ref.add(data); return { id: r.id }; }
      };
    },
    /* Real-time: calls onRemote() whenever ANOTHER phone changes something. */
    listen(onRemote, onState){
      const stops = [];
      const watch = (ref) => {
        let first = true;
        const stop = ref.onSnapshot({ includeMetadataChanges: false }, (snap) => {
          if(onState) onState('live');
          if(first){ first = false; onRemote(true); return; }   // catch up on anything missed while connecting
          if(snap.metadata.hasPendingWrites) return;     // our own write echoing back
          onRemote();
        }, (err) => { console.error('firestore listen error', err); if(onState) onState('error'); });
        stops.push(stop);
      };
      SYNC_COLLECTIONS.forEach(c => watch(fs.collection(root + c)));
      watch(fs.doc(root + 'farm/settings'));
      return () => stops.forEach(s => { try{ s(); }catch(e){} });
    }
  };
}
function makeFirebaseAssets(app, code){
  const folder = app.storage().ref('rooms/' + code + '/assets/');
  async function doUpload(id, fileOrBlob){
    const ref = folder.child(id);
    await ref.put(fileOrBlob);
    const url = await ref.getDownloadURL();
    return { id, url };
  }
  return {
    upload: async (file) => await doUpload(uid(), file),
    _uploadPreservingId: async (id, blob) => await doUpload(id, blob)
  };
}

/* ---------- Supabase ---------- */
const SUPABASE_SQL = `-- BriidgeITFarm (with login) -> run this ONCE in Supabase: SQL Editor -> New query -> paste -> Run
-- Safe to run again later.

-- 1) Remove the old open-access functions from the first version, if you ran them
drop function if exists public.farm_get(text, text);
drop function if exists public.farm_set(text, text, jsonb, boolean);
drop function if exists public.farm_delete(text, text);

-- 2) Tables (nobody can read them directly; only the functions below can)
create table if not exists public.farm_docs (
  room text not null,
  path text not null,
  data jsonb not null default '{}'::jsonb,
  updated_at timestamptz not null default now(),
  primary key (room, path)
);
create table if not exists public.farm_members (
  user_id uuid primary key references auth.users(id) on delete cascade,
  room text not null,
  role text not null check (role in ('owner', 'worker')),
  email text,
  created_at timestamptz not null default now()
);
create table if not exists public.farm_invites (
  code text primary key,
  room text not null,
  created_by uuid not null,
  created_at timestamptz not null default now(),
  expires_at timestamptz not null default (now() + interval '7 days'),
  used_by uuid,
  used_at timestamptz
);
alter table public.farm_docs enable row level security;
alter table public.farm_members enable row level security;
alter table public.farm_invites enable row level security;
revoke all on public.farm_docs, public.farm_members, public.farm_invites from anon, authenticated;

-- 3) Who am I?
create or replace function public.farm_my_membership()
returns table(room text, role text, email text)
language sql security definer set search_path = public as $$
  select m.room, m.role, m.email from farm_members m where m.user_id = auth.uid();
$$;

-- 4) The first person to sign up claims the farm and becomes the owner
create or replace function public.farm_create(p_room text)
returns void language plpgsql security definer set search_path = public as $$
declare uid uuid := auth.uid(); mail text;
begin
  if uid is null then raise exception 'not signed in'; end if;
  if p_room !~ '^[A-Za-z0-9_-]{4,40}$' then raise exception 'bad farm code'; end if;
  if exists (select 1 from farm_members where role = 'owner') then
    raise exception 'this project already has an owner';
  end if;
  select u.email into mail from auth.users u where u.id = uid;
  insert into farm_members(user_id, room, role, email) values (uid, p_room, 'owner', mail);
end $$;

-- 5) Read / write farm records (members only; workers have limits)
create or replace function public.farm_get(p_prefix text)
returns table(doc_path text, doc_data jsonb)
language plpgsql security definer set search_path = public as $$
declare r text;
begin
  select m.room into r from farm_members m where m.user_id = auth.uid();
  if r is null then raise exception 'not a member of this farm'; end if;
  return query select d.path, d.data from farm_docs d
    where d.room = r and d.path like p_prefix || '%' order by d.path;
end $$;

create or replace function public.farm_set(p_path text, p_data jsonb, p_merge boolean default false)
returns void language plpgsql security definer set search_path = public as $$
declare r text; rl text; cur jsonb; dat jsonb := coalesce(p_data, '{}'::jsonb);
begin
  select m.room, m.role into r, rl from farm_members m where m.user_id = auth.uid();
  if r is null then raise exception 'not a member of this farm'; end if;
  if rl <> 'owner' then
    if p_path = 'farm/settings' then raise exception 'only the owner can change farm settings'; end if;
    if p_path like 'requests/%' then
      select d.data into cur from farm_docs d where d.room = r and d.path = p_path;
      if cur is not null and coalesce(cur->>'status', 'pending') <> 'pending' then
        raise exception 'only the owner can change a decided request';
      end if;
      if dat ? 'status' and dat->>'status' <> 'pending' then
        raise exception 'only the owner can approve or decline requests';
      end if;
    end if;
    if p_path like 'transactions/%' and dat ? 'requestId' then
      raise exception 'only the owner can record an approved request';
    end if;
  end if;
  if p_merge then
    insert into farm_docs(room, path, data) values (r, p_path, dat)
    on conflict (room, path) do update set data = farm_docs.data || excluded.data, updated_at = now();
  else
    insert into farm_docs(room, path, data) values (r, p_path, dat)
    on conflict (room, path) do update set data = excluded.data, updated_at = now();
  end if;
end $$;

create or replace function public.farm_delete(p_path text)
returns void language plpgsql security definer set search_path = public as $$
declare r text; rl text;
begin
  select m.room, m.role into r, rl from farm_members m where m.user_id = auth.uid();
  if r is null then raise exception 'not a member of this farm'; end if;
  if rl <> 'owner' then
    if not (p_path like 'requests/%' and exists (
      select 1 from farm_docs d where d.room = r and d.path = p_path and coalesce(d.data->>'status', 'pending') = 'pending'
    )) then raise exception 'only the owner can delete records'; end if;
  end if;
  delete from farm_docs d where d.room = r and d.path = p_path;
end $$;

-- 6) Invite links for workers (single use, valid 7 days)
create or replace function public.farm_invite_create()
returns text language plpgsql security definer set search_path = public as $$
declare r text; rl text; c text;
begin
  select m.room, m.role into r, rl from farm_members m where m.user_id = auth.uid();
  if r is null or rl <> 'owner' then raise exception 'only the owner can invite workers'; end if;
  c := replace(gen_random_uuid()::text, '-', '') || replace(gen_random_uuid()::text, '-', '');
  insert into farm_invites(code, room, created_by) values (c, r, auth.uid());
  return c;
end $$;

create or replace function public.farm_join(p_code text)
returns text language plpgsql security definer set search_path = public as $$
declare uid uuid := auth.uid(); inv farm_invites%rowtype; mail text; existing text;
begin
  if uid is null then raise exception 'not signed in'; end if;
  select m.room into existing from farm_members m where m.user_id = uid;
  if existing is not null then return existing; end if;
  select * into inv from farm_invites i where i.code = p_code for update;
  if not found or inv.used_by is not null or inv.expires_at < now() then
    raise exception 'this invite link is invalid, already used, or expired';
  end if;
  select u.email into mail from auth.users u where u.id = uid;
  insert into farm_members(user_id, room, role, email) values (uid, inv.room, 'worker', mail);
  update farm_invites set used_by = uid, used_at = now() where code = p_code;
  return inv.room;
end $$;

-- 7) Team list / remove (owner only)
create or replace function public.farm_members_list()
returns table(member_id uuid, member_email text, member_role text, joined_at timestamptz, is_me boolean)
language plpgsql security definer set search_path = public as $$
declare r text; rl text;
begin
  select m.room, m.role into r, rl from farm_members m where m.user_id = auth.uid();
  if r is null or rl <> 'owner' then raise exception 'only the owner can see the team'; end if;
  return query select m.user_id, m.email, m.role, m.created_at, (m.user_id = auth.uid())
    from farm_members m where m.room = r order by m.created_at;
end $$;

create or replace function public.farm_member_remove(p_user uuid)
returns void language plpgsql security definer set search_path = public as $$
declare r text; rl text;
begin
  select m.room, m.role into r, rl from farm_members m where m.user_id = auth.uid();
  if r is null or rl <> 'owner' then raise exception 'only the owner can remove people'; end if;
  if p_user = auth.uid() then raise exception 'you cannot remove yourself'; end if;
  delete from farm_members m where m.user_id = p_user and m.room = r;
end $$;

function loadScriptOnce(url){
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = url; s.onload = () => resolve(); s.onerror = () => reject(new Error('script failed: ' + url));
    document.head.appendChild(s);
  });
}
async function ensureSupabaseLib(){
  if(window.supabase && window.supabase.createClient) return;
  await loadScriptOnce(SUPABASE_JS_URL);
  if(!(window.supabase && window.supabase.createClient)) throw new Error('Supabase library did not load');
}

function makeSupabaseDB(client, room, notify){
  let cache = null;
  const PAGE = 1000;
  function check(error){
    if(!error) return;
    const msg = String(error.message || '');
    if(/not a member of this farm/i.test(msg)) setTimeout(handleRemovedFromFarm, 0);
    else if(/only the owner/i.test(msg)) toast('Only the owner can do that');
    throw error;
  }
  async function fetchAll(){
    const rows = [];
    for(let from = 0; ; from += PAGE){
      const { data, error } = await client.rpc('farm_get', { p_prefix: '' }).range(from, from + PAGE - 1);
      check(error);
      rows.push(...(data || []));
      if(!data || data.length < PAGE) break;
    }
    return rows;
  }
  // One request serves every collection read in a refresh (loadAll asks for 8 at once).
  function allRows(){
    if(!cache || Date.now() - cache.t > 400){
      const p = fetchAll();
      cache = { t: Date.now(), p };
      p.catch(() => { if(cache && cache.p === p) cache = null; });
    }
    return cache.p;
  }
  async function write(fn, args){
    const { error } = await client.rpc(fn, args);
    cache = null;
    check(error);
    notify();
  }
  const clean = (d) => JSON.parse(JSON.stringify(d || {}));
  return {
    doc(path){
      return {
        get: async () => { const row = (await allRows()).find(r => r.doc_path === path); return { exists: !!row, data: () => (row ? row.doc_data : undefined) }; },
        set: async (data) => { await write('farm_set', { p_path: path, p_data: clean(data), p_merge: false }); },
        update: async (partial) => { await write('farm_set', { p_path: path, p_data: clean(partial), p_merge: true }); },
        delete: async () => { await write('farm_delete', { p_path: path }); }
      };
    },
    collection(path){
      const prefix = path + '/';
      return {
        get: async () => {
          const rows = (await allRows()).filter(r => r.doc_path.startsWith(prefix) && !r.doc_path.slice(prefix.length).includes('/'));
          return { docs: rows.map(r => ({ id: r.doc_path.slice(prefix.length), data: () => r.doc_data })) };
        },
        add: async (data) => { const id = uid(); await write('farm_set', { p_path: prefix + id, p_data: clean(data), p_merge: false }); return { id }; }
      };
    },
    /* Real-time: Broadcast pings between phones + refresh when the app wakes or reconnects. */
    listen(onRemote, onState){
      const channel = client.channel('farm-' + room, { config: { broadcast: { self: false } } });
      channel.on('broadcast', { event: 'change' }, () => { cache = null; onRemote(); });
      channel.subscribe((status) => {
        if(status === 'SUBSCRIBED'){ if(onState) onState('live'); cache = null; onRemote(true); }
        else if(status === 'CHANNEL_ERROR' || status === 'TIMED_OUT'){ if(onState) onState('offline'); }
        else if(status === 'CLOSED'){ if(onState) onState(navigator.onLine === false ? 'offline' : 'connecting'); }
      });
      notifyHook.send = () => { try{ channel.send({ type: 'broadcast', event: 'change', payload: { t: Date.now() } }); }catch(e){} };
      const poll = setInterval(() => { if(document.visibilityState === 'visible'){ cache = null; onRemote(true); } }, 30000);
      return () => { clearInterval(poll); notifyHook.send = () => {}; try{ client.removeChannel(channel); }catch(e){} };
    }
  };
}
const notifyHook = { send: () => {} };

function makeSupabaseAssets(client, room){
  const bucket = 'farm-photos';
  async function doUpload(id, blob){
    const path = room + '/' + id;
    const { error } = await client.storage.from(bucket).upload(path, blob, { upsert: true, contentType: (blob && blob.type) || 'image/jpeg', cacheControl: '31536000' });
    if(error) throw error;
    const { data } = client.storage.from(bucket).getPublicUrl(path);
    return { id, url: data.publicUrl };
  }
  return {
    upload: async (file) => await doUpload(uid(), file),
    _uploadPreservingId: async (id, blob) => await doUpload(id, blob)
  };
}

async function makeSupabaseClient(cfg){
  await ensureSupabaseLib();
  return window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false, storageKey: 'bridgeitfarm-auth' }
  });
}
async function supabaseAuth(client, mode, email, password){
  if(mode === 'signin'){
    const { error } = await client.auth.signInWithPassword({ email, password });
    if(error) throw error;
    return;
  }
  const { data, error } = await client.auth.signUp({ email, password });
  if(error) throw error;
  if(!data || !data.session){ const e = new Error('CONFIRM_EMAIL'); e.code = 'CONFIRM_EMAIL'; throw e; }
}
async function supabaseMembership(client){
  const { data, error } = await client.rpc('farm_my_membership');
  if(error) throw error;
  return (data && data[0]) || null;
}
/* Points the whole app at the signed-in Supabase farm (call loadAll + startLiveSync afterwards). */
function activateSupabase(cfg, client, m){
  stopLiveSync();
  supabaseClient = client; firebaseApp = null;
  db = makeSupabaseDB(client, m.room, () => notifyHook.send());
  assetsApi = makeSupabaseAssets(client, m.room);
  SYNC_MODE = 'supabase'; SYNC_CODE = m.room; SYNC_ROLE = m.role; SYNC_EMAIL = m.email || '';
  saveSyncConfigLocal({ provider: 'supabase', supabaseUrl: cfg.supabaseUrl, supabaseKey: cfg.supabaseKey });
  applyRole();
}

function b64urlEncode(obj){
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  let s = ''; bytes.forEach(b => { s += String.fromCharCode(b); });
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function parseInvite(p){
  try{
    let b = String(p || '').replace(/-/g, '+').replace(/_/g, '/');
    b += '='.repeat((4 - b.length % 4) % 4);
    const bin = atob(b);
    const o = JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))));
    if(o && /^https:\/\/[a-z0-9-]+\.supabase\.(co|in)$/i.test(o.u) && typeof o.k === 'string' && o.k.length > 20 && typeof o.c === 'string' && o.c.length > 10) return o;
  }catch(e){}
  return null;
}

/* ---------- pushing this phone's existing data up the first time ---------- */
async function pushLocalDataToCloud(cloudDb, cloudAssets){
  // 1) photos first, so the saved records can point at web addresses that work on every phone
  const urlById = {};
  const assetIds = new Set();
  STATE.pigs.forEach(p => { if(p.photoId) assetIds.add(p.photoId); (p.photos || []).forEach(ph => ph.id && assetIds.add(ph.id)); });
  STATE.transactions.forEach(t => { if(t.receiptId) assetIds.add(t.receiptId); });
  STATE.farmPhotos.forEach(fp => { if(fp.photoId) assetIds.add(fp.photoId); });
  STATE.requests.forEach(r => { if(r.attachmentId) assetIds.add(r.attachmentId); });
  STATE.births.forEach(b => { if(b.photoId) assetIds.add(b.photoId); });
  for(const id of assetIds){
    const row = await getLocalAssetRow(id);
    if(row){ const res = await cloudAssets._uploadPreservingId(id, row.blob); urlById[id] = res.url; }
  }
  const fix = (id, old) => (id && urlById[id]) ? urlById[id] : old;

  // 2) records, with durable URLs swapped in
  if(STATE.settings) await cloudDb.doc('farm/settings').set(STATE.settings);
  const prepare = {
    pigs: (p) => Object.assign({}, p, { photoUrl: fix(p.photoId, p.photoUrl || null), photos: (p.photos || []).map(ph => Object.assign({}, ph, { url: fix(ph.id, ph.url) })) }),
    transactions: (t) => Object.assign({}, t, { receiptUrl: fix(t.receiptId, t.receiptUrl || null) }),
    births: (b) => Object.assign({}, b, { photoUrl: fix(b.photoId, b.photoUrl || null) }),
    farmPhotos: (f) => Object.assign({}, f, { url: fix(f.photoId, f.url) }),
    requests: (r) => Object.assign({}, r, { attachmentUrl: fix(r.attachmentId, r.attachmentUrl || null) })
  };
  const collections = [
    ['pigs', STATE.pigs], ['transactions', STATE.transactions], ['births', STATE.births],
    ['suppliers', STATE.suppliers], ['farmPhotos', STATE.farmPhotos], ['agreements', STATE.agreements], ['requests', STATE.requests]
  ];
  for(const [col, items] of collections){
    for(const item of (items || [])){
      const doc = prepare[col] ? prepare[col](item) : item;
      const { id, ...rest } = doc;
      await cloudDb.doc(col + '/' + id).set(rest);
    }
  }
}

function startLiveSync(){

}

/* ---------- connect / disconnect ---------- */
function validSyncCode(code){ return /^[A-Za-z0-9_-]{4,40}$/.test(code); }

async function connectFirebaseBackend(cfg){
  if(typeof firebase === 'undefined') throw new Error('The Firebase library could not load — check the internet connection.');
  const app = firebase.initializeApp(cfg.firebaseConfig, 'bridgeitfarm-' + Date.now());
  return { db: makeFirebaseDB(app, cfg.syncCode), assets: makeFirebaseAssets(app, cfg.syncCode), app };
}

async function handleConnectSync(form, submitter){
  const fd = new FormData(form);
  const provider = fd.get('provider') === 'supabase' ? 'supabase' : 'firebase';
  if(provider === 'supabase') return connectSupabaseOwner(fd, submitter && submitter.dataset && submitter.dataset.mode === 'signin' ? 'signin' : 'signup');

  const code = String(fd.get('syncCodeFb') || '').trim();
  if(!validSyncCode(code)){ toast('Sync code: 4–40 letters, numbers, - or _ (no spaces)'); return; }
  const cfg = { provider, syncCode: code };
  const text = String(fd.get('firebaseConfig') || '').trim();
  if(!text){ toast('Paste your Firebase config'); return; }
  try{ cfg.firebaseConfig = parseFirebaseConfig(text); }catch(e){ toast("That doesn't look like a Firebase config"); return; }

  const previous = { db, assetsApi, mode: SYNC_MODE, code: SYNC_CODE };
  toast('Connecting…');
  try{
    const be = await connectFirebaseBackend(cfg);
    const settingsSnap = await be.db.doc('farm/settings').get();
    const pigsSnap = await be.db.collection('pigs').get();
    const cloudHasData = settingsSnap.exists || pigsSnap.docs.length > 0;
    if(!cloudHasData){
      toast('Copying this phone’s farm to the cloud…');
      await pushLocalDataToCloud(be.db, be.assets);
    }
    stopLiveSync();
    firebaseApp = be.app; supabaseClient = null;
    db = be.db; assetsApi = be.assets;
    SYNC_MODE = 'firebase'; SYNC_CODE = code; SYNC_ROLE = ''; SYNC_EMAIL = ''; applyRole();
    saveSyncConfigLocal(cfg);
    await loadAll();
    startLiveSync();
    setSyncStatus('connecting');
    render();
    toast(cloudHasData ? 'Connected — now showing the shared farm' : 'Connected — this phone’s farm is now shared');
  }catch(err){
    console.error(err);
    db = previous.db; assetsApi = previous.assetsApi; SYNC_MODE = previous.mode; SYNC_CODE = previous.code;
    toast(explainSyncError(err, 'firebase'));
    const line = document.getElementById('syncStatusLine'); if(line) line.textContent = explainSyncError(err, 'firebase');
  }
}

/* Owner: create the account (first time) or sign in, then go live. */
async function connectSupabaseOwner(fd, mode){
  const cfg = { provider: 'supabase',
    supabaseUrl: String(fd.get('supabaseUrl') || '').trim().replace(/\/+$/, ''),
    supabaseKey: String(fd.get('supabaseKey') || '').trim() };
  const email = String(fd.get('email') || '').trim().toLowerCase();
  const password = String(fd.get('password') || '');
  const code = String(fd.get('syncCode') || '').trim();
  if(!/^https:\/\/[a-z0-9-]+\.supabase\.(co|in)$/i.test(cfg.supabaseUrl)){ toast('Supabase URL should look like https://abcd1234.supabase.co'); return; }
  if(cfg.supabaseKey.length < 20){ toast('Paste the Supabase anon / publishable key'); return; }
  if(!/^\S+@\S+\.\S+$/.test(email)){ toast('Enter your email'); return; }
  if(password.length < 8){ toast('Password needs at least 8 characters'); return; }

  let client = null;
  toast(mode === 'signin' ? 'Signing in…' : 'Creating your account…');
  try{
    client = await makeSupabaseClient(cfg);
    await supabaseAuth(client, mode, email, password);
    let m = await supabaseMembership(client);
    let created = false;
    if(!m){
      if(!validSyncCode(code)){ toast('Choose a farm code: 4–40 letters, numbers, - or _'); try{ await client.auth.signOut(); }catch(e){} return; }
      const { error } = await client.rpc('farm_create', { p_room: code });
      if(error) throw error;
      m = await supabaseMembership(client); created = true;
    }
    if(created){
      toast('Copying this phone’s farm to the cloud…');
      await pushLocalDataToCloud(makeSupabaseDB(client, m.room, () => {}), makeSupabaseAssets(client, m.room));
    }
    activateSupabase(cfg, client, m);
    await loadAll();
    startLiveSync();
    setSyncStatus('connecting');
    render();
    toast(created ? 'Farm created — you are the owner. Invite workers from Settings.' : 'Signed in — now showing the shared farm');
  }catch(err){
    console.error(err);
    if(client && err && err.code !== 'CONFIRM_EMAIL'){ try{ await client.auth.signOut(); }catch(e){} }
    const t = explainSyncError(err, 'supabase');
    toast(t);
    const line = document.getElementById('syncStatusLine'); if(line) line.textContent = t;
  }
}

/* Worker: opens the owner's invite link, makes an account, joins the farm. */
async function handleJoin(form, submitter, payload){
  const inv = parseInvite(payload);
  if(!inv){ toast('This invite link is not valid'); return; }
  const mode = submitter && submitter.dataset && submitter.dataset.mode === 'signin' ? 'signin' : 'signup';
  const email = String(form.email.value || '').trim().toLowerCase();
  const password = String(form.password.value || '');
  if(!/^\S+@\S+\.\S+$/.test(email)){ toast('Enter your email'); return; }
  if(password.length < 8){ toast('Password needs at least 8 characters'); return; }
  const cfg = { provider: 'supabase', supabaseUrl: inv.u, supabaseKey: inv.k };
  const msg = document.getElementById('joinMsg');
  let client = null;
  if(msg) msg.textContent = 'Joining…';
  try{
    client = await makeSupabaseClient(cfg);
    await supabaseAuth(client, mode, email, password);
    let m = await supabaseMembership(client);
    if(!m){
      const { error } = await client.rpc('farm_join', { p_code: inv.c });
      if(error) throw error;
      m = await supabaseMembership(client);
    }
    if(!m) throw new Error('Could not join the farm');
    activateSupabase(cfg, client, m);
    await loadAll();
    startLiveSync();
    setSyncStatus('connecting');
    location.hash = '#/';
    toast('Welcome — you are signed in');
  }catch(err){
    console.error(err);
    const t = explainSyncError(err, 'supabase');
    if(msg) msg.textContent = t;
    toast(t);
  }
}

function explainSyncError(err, provider){
  const raw = String((err && (err.message || err.code)) || err || '');
  const m = raw.toLowerCase();
  if(provider === 'supabase'){
    if(err && err.code === 'CONFIRM_EMAIL') return 'Account created. Supabase wants the email confirmed first: open the confirmation email, then come back and tap “I already have an account”. (Owner tip: turn off “Confirm email” in Supabase → Authentication → Sign In / Providers → Email to skip this.)';
    if(m.indexOf('already has an owner') >= 0) return 'This Supabase project already has an owner. Tap “I already have an account” and sign in, or ask the owner for an invite link.';
    if(m.indexOf('invalid login') >= 0) return 'Wrong email or password.';
    if(m.indexOf('already registered') >= 0 || m.indexOf('already been registered') >= 0) return 'That email already has an account — tap “I already have an account”.';
    if(m.indexOf('invite link is invalid') >= 0) return 'This invite link was already used or has expired. Ask the owner for a new one.';
    if(m.indexOf('not a member') >= 0) return 'This login is not part of the farm. Ask the owner for an invite link.';
    if(m.indexOf('only the owner') >= 0) return 'Only the owner can do that.';
    if(m.indexOf('email not confirmed') >= 0) return 'Confirm your email first (check your inbox), then sign in.';
    if(m.indexOf('rate limit') >= 0 || m.indexOf('too many') >= 0) return 'Too many tries — wait a minute and try again.';
    if(m.indexOf('farm_my_membership') >= 0 || m.indexOf('schema cache') >= 0 || m.indexOf('could not find the function') >= 0) return 'Supabase is reachable, but the setup SQL has not been run yet (Settings → Copy the setup SQL).';
    if(m.indexOf('bucket') >= 0 || m.indexOf('row-level security') >= 0 || m.indexOf('policy') >= 0) return 'Supabase photo storage is not set up — run the setup SQL again.';
    if(m.indexOf('invalid api key') >= 0 || m.indexOf('jwt') >= 0 || m.indexOf('apikey') >= 0) return 'Supabase rejected the key — paste the anon / publishable key.';
    if(m.indexOf('failed to fetch') >= 0 || m.indexOf('network') >= 0) return 'Could not reach Supabase — check the URL and the internet.';
    return 'Supabase: ' + raw.slice(0, 140);
  }
  if(m.indexOf('permission') >= 0 || m.indexOf('insufficient') >= 0) return 'Firebase refused access — publish the Firestore and Storage rules (Settings → Copy Firebase rules).';
  if(m.indexOf('unavailable') >= 0 || m.indexOf('network') >= 0 || m.indexOf('offline') >= 0) return 'Could not reach Firebase — check the internet.';
  if(m.indexOf('storage') >= 0 && m.indexOf('bucket') >= 0) return 'Firebase Storage is not turned on for this project.';
  return 'Firebase error: ' + raw.slice(0, 120);
}

/* Accepts the config pasted as JSON OR as the JavaScript object Firebase shows ({ apiKey: "..." }). */
function parseFirebaseConfig(text){
  let t = text.trim();
  const m = t.match(/\{[\s\S]*\}/);
  if(m) t = m[0];
  let obj;
  try{ obj = JSON.parse(t); }
  catch(e){
    const fixed = t.replace(/([{,]\s*)([A-Za-z_][A-Za-z0-9_]*)\s*:/g, '$1"$2":').replace(/'/g, '"').replace(/,\s*}/g, '}');
    obj = JSON.parse(fixed);
  }
  if(!obj.apiKey || !obj.projectId) throw new Error('missing apiKey/projectId');
  return obj;
}

async function initCapabilities(){
  await openIDB();

  const cfg = loadSyncConfig();
  let connected = false;
  if(cfg && cfg.provider === 'supabase' && cfg.supabaseUrl && cfg.supabaseKey){
    SYNC_MODE = 'supabase'; setSyncStatus('connecting');
    try{
      const client = await makeSupabaseClient(cfg);
      const { data } = await client.auth.getSession();
      let m = null;
      if(data && data.session) m = await supabaseMembership(client);
      else m = await promptSignIn(cfg, client);
      if(m){ activateSupabase(cfg, client, m); connected = true; }
      else { SYNC_MODE = 'local'; setSyncStatus('local'); db = makeLocalDB(); assetsApi = makeLocalAssets(); }
    }catch(e){
      console.error('supabase init failed', e);
      db = makeLocalDB(); assetsApi = makeLocalAssets();
      SYNC_MODE = 'local'; SYNC_CODE = ''; SYNC_ROLE = ''; applyRole(); setSyncStatus('local');
      toast('Could not reach the shared farm — showing this phone’s own copy. Check the internet and reopen.');
    }
  } else if(cfg && cfg.syncCode && cfg.firebaseConfig){
    SYNC_MODE = 'firebase'; SYNC_CODE = cfg.syncCode; setSyncStatus('connecting');
    try{
      const be = await connectFirebaseBackend(cfg);
      firebaseApp = be.app; db = be.db; assetsApi = be.assets;
      connected = true;
    }catch(e){
      // Never silently show an empty "local" farm when the person expected the shared one.
      console.error('cloud sync init failed', e);
      db = makeLocalDB(); assetsApi = makeLocalAssets();
      SYNC_MODE = 'local'; SYNC_CODE = ''; setSyncStatus('local');
      toast('Could not reach the shared farm — showing this phone’s own copy. Check the internet and reopen.');
    }
  } else {
    db = makeLocalDB(); assetsApi = makeLocalAssets();
  }

  await loadAll();
  if(!connected) await resolveAllAssetURLs();
  render();
  if(connected) startLiveSync();
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  }
}

/* ============================== UTIL ============================== */
function uid(){ return 'id' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function blobUrl(assetId, fallbackUrl){
  if(assetId && ASSET_URL_CACHE[assetId]) return ASSET_URL_CACHE[assetId];
  return fallbackUrl || '';
}
function money(n){
  const sym = (STATE.settings && STATE.settings.currency) || '$';
  const v = Number(n)||0;
  return sym + v.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
}
function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso + (iso.length<=10 ? 'T00:00:00' : ''));
  if(isNaN(d)) return iso;
  return d.toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'});
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function daysBetween(a,b){ return Math.round((b-a)/86400000); }

function effectiveBirthDate(pig){
  if(pig.birthDate) return new Date(pig.birthDate + 'T00:00:00');
  if(pig.acquiredDate){
    const base = new Date(pig.acquiredDate + 'T00:00:00');
    if(pig.boughtStage === 'piglet') base.setDate(base.getDate() - 30);
    else base.setDate(base.getDate() - 400);
    return base;
  }
  return null;
}
function pigAgeLabel(pig){
  const bd = effectiveBirthDate(pig);
  if(!bd) return 'Age unknown';
  const days = daysBetween(bd, new Date());
  if(days < 0) return 'Newborn';
  if(days < 60) return days + ' day' + (days===1?'':'s') + ' old';
  if(days < 365) return Math.floor(days/30) + ' mo old';
  const yrs = (days/365);
  return yrs.toFixed(1) + ' yr old';
}
function pigStage(pig){
  const bd = effectiveBirthDate(pig);
  if(!bd) return 'adult';
  const days = daysBetween(bd, new Date());
  return days < SPECIES[speciesOf(pig)].matureDays ? 'piglet' : 'adult';
}
function pigDisplayStatus(pig){
  if(pig.status === 'sold') return 'sold';
  if(pig.status === 'deceased') return 'deceased';
  return pigStage(pig);
}
function pigById(id){ return STATE.pigs.find(p => p.id === id); }
function pigName(id){ const p = pigById(id); return p ? p.name : 'Unknown'; }
function pigMainPhotoUrl(pig){
  if(!pig) return null;
  if(pig.photoUrl) return pig.photoUrl;
  return blobUrl(pig.photoId);
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}

function computeStats(){
  const active = STATE.pigs.filter(p => p.status === 'active');
  const piglets = active.filter(p => pigStage(p) === 'piglet').length;
  const adults = active.length - piglets;
  const bought = STATE.pigs.filter(p => p.source === 'bought').length;
  const sold = STATE.pigs.filter(p => p.status === 'sold').length;
  return { total: active.length, piglets, adults, bought, sold };
}

function allPhotosChrono(){
  const items = [];

  STATE.farmPhotos.forEach(fp => items.push({ assetId: fp.photoId, url: fp.url, date: fp.date, caption: fp.caption || 'Farm photo', kind:'farm' }));

}

/* ============================== IN-APP CAMERA ==============================
   pickPhoto() opens a full-screen camera INSIDE the app (no hand-off to the phone's
   camera app). It resolves with a File, or null if the person closes it.
   If the camera can't open (permission blocked, page not on https, very old browser)
   it shows a message and the "Choose a photo" button still works. */
let cameraStream = null;
function stopCameraStream(){
  if(cameraStream){
    cameraStream.getTracks().forEach(t => { try{ t.stop(); }catch(e){} });
    cameraStream = null;
  }
}

function pickPhoto(opts){
  opts = opts || {};
  const layer = document.getElementById('cameraLayer');
  if(!layer) return Promise.resolve(null);
  return new Promise((resolve) => {
    let facing = 'environment';
    let blob = null;
    let previewUrl = '';
    let done = false;

    layer.innerHTML = `
      <div class="camera-overlay" role="dialog" aria-label="Camera">
        <div class="cam-top">
          <button type="button" class="cam-btn" data-cam="close" aria-label="Close camera">✕</button>
          <div class="cam-title">${esc(opts.title || 'Take a photo')}</div>
          <span style="width:44px"></span>
        </div>
        <div class="cam-stage">
          <video class="cam-video" playsinline autoplay muted></video>
          <img class="cam-preview" alt="Captured photo" style="display:none">
          <div class="cam-msg" style="display:none"></div>
        </div>
        <div class="cam-controls">
          <div class="cam-live">
            <button type="button" class="cam-side" data-cam="gallery">Choose<br>a photo</button>
            <button type="button" class="cam-shutter" data-cam="shoot" aria-label="Take photo"><span></span></button>
            <button type="button" class="cam-side" data-cam="flip">Flip<br>camera</button>
          </div>
          <div class="cam-review" style="display:none">
            <button type="button" class="cam-side wide" data-cam="retake">Retake</button>
            <button type="button" class="cam-use" data-cam="use">Use photo</button>
          </div>
          <input type="file" accept="image/*" class="cam-file" style="display:none">
        </div>
      </div>`;
    document.body.classList.add('camera-open');

    const root = layer.firstElementChild;
    const video = root.querySelector('.cam-video');
    const preview = root.querySelector('.cam-preview');
    const msg = root.querySelector('.cam-msg');
    const liveBar = root.querySelector('.cam-live');
    const reviewBar = root.querySelector('.cam-review');
    const fileInput = root.querySelector('.cam-file');
    const shootBtn = root.querySelector('[data-cam=shoot]');
    const flipBtn = root.querySelector('[data-cam=flip]');

    function finish(file){
      if(done) return;
      done = true;
      stopCameraStream();
      document.removeEventListener('keydown', onKey);
      window.removeEventListener('hashchange', onHash);
      if(previewUrl){ try{ URL.revokeObjectURL(previewUrl); }catch(e){} }
      layer.innerHTML = '';
      document.body.classList.remove('camera-open');
      resolve(file || null);
    }
    function onKey(e){ if(e.key === 'Escape') finish(null); }
    function onHash(){ finish(null); }
    document.addEventListener('keydown', onKey);
    window.addEventListener('hashchange', onHash);

    function showMessage(text){
      stopCameraStream();
      video.style.display = 'none';
      preview.style.display = 'none';
      msg.style.display = 'flex';
      msg.textContent = text;
      shootBtn.disabled = true;
      flipBtn.disabled = true;
    }

    async function startCamera(){
      stopCameraStream();
      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
        showMessage('The camera can’t open in this browser. Tap “Choose a photo” to pick one instead.');
        return;
      }
      try{
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: facing }, width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false
        });
        if(done){ stream.getTracks().forEach(t => { try{ t.stop(); }catch(e){} }); return; }
        cameraStream = stream;
        video.srcObject = stream;
        video.classList.toggle('mirror', facing === 'user');
        try{ await video.play(); }catch(e){}
        msg.style.display = 'none';
        video.style.display = 'block';
        shootBtn.disabled = false;
        flipBtn.disabled = false;
      }catch(err){
        if(done) return;
        const name = err && err.name;
        if(name === 'NotAllowedError' || name === 'SecurityError'){
          showMessage('Camera access is blocked. Allow the camera for this site in your browser settings, or tap “Choose a photo”.');
        } else if(name === 'NotFoundError' || name === 'OverconstrainedError'){
          showMessage('No camera was found on this device. Tap “Choose a photo” instead.');
        } else {
          showMessage('The camera couldn’t start. Tap “Choose a photo” to pick one instead.');
        }
      }
    }

    function shoot(){
      const w = video.videoWidth, h = video.videoHeight;
      if(!w || !h){ toast('The camera is still starting — try again'); return; }
      const scale = Math.min(1, 1600 / Math.max(w, h));
      const c = document.createElement('canvas');
      c.width = Math.round(w * scale);
      c.height = Math.round(h * scale);
      c.getContext('2d').drawImage(video, 0, 0, c.width, c.height);
      c.toBlob((b) => {
        if(!b){ toast('Could not capture the photo — try again'); return; }
        blob = b;
        if(previewUrl){ try{ URL.revokeObjectURL(previewUrl); }catch(e){} }
        previewUrl = URL.createObjectURL(b);
        preview.src = previewUrl;
        preview.style.display = 'block';
        video.style.display = 'none';
        liveBar.style.display = 'none';
        reviewBar.style.display = 'flex';
      }, 'image/jpeg', 0.85);
    }

    function retake(){
      blob = null;
      preview.style.display = 'none';
      video.style.display = 'block';
      reviewBar.style.display = 'none';
      liveBar.style.display = 'flex';
    }

    root.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-cam]');
      if(!btn || btn.disabled) return;
      const act = btn.getAttribute('data-cam');
      if(act === 'close') finish(null);
      else if(act === 'shoot') shoot();
      else if(act === 'retake') retake();
      else if(act === 'flip'){ facing = facing === 'environment' ? 'user' : 'environment'; startCamera(); }
      else if(act === 'gallery') fileInput.click();
      else if(act === 'use'){
        if(blob) finish(new File([blob], 'photo-' + Date.now() + '.jpg', { type: 'image/jpeg' }));
      }
    });
    fileInput.addEventListener('change', () => {
      const f = fileInput.files && fileInput.files[0];
      if(f) finish(f);
    });

    startCamera();
  });
}

/* Shrinks big photos before they are stored/uploaded (phone photos are often 3–5 MB). */
async function downscaleImage(file, maxSide){
  maxSide = maxSide || 1600;
  try{
    if(!file || !file.type || file.type.indexOf('image/') !== 0 || file.type === 'image/gif' || file.type === 'image/svg+xml') return file;
    const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
    const scale = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
    if(scale === 1 && file.size < 900 * 1024){ if(bmp.close) bmp.close(); return file; }
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * scale);
    c.height = Math.round(bmp.height * scale);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    if(bmp.close) bmp.close();
    const out = await new Promise(res => c.toBlob(res, 'image/jpeg', 0.85));
    if(!out || out.size >= file.size) return file;
    return new File([out], (file.name || 'photo').replace(/\.[^.]+$/, '') + '.jpg', { type: 'image/jpeg' });
  }catch(e){ return file; }
}

function showFieldPreview(field, file){
  const reader = new FileReader();
  reader.onload = () => {
    field.classList.add('has-img');
    let img = field.querySelector('img');
    if(!img){ img = document.createElement('img'); field.prepend(img); }
    img.src = reader.result;
    const hint = field.querySelector('.hint');
    if(hint) hint.textContent = 'Tap to retake';
  };
  reader.readAsDataURL(file);
}

  try{

}

function treeNodeHtml(pig, role, isCurrent){
  if(!pig){
    return `<div class="tree-node placeholder"><div class="tree-thumb">?</div><div class="tree-name">Unknown</div>${role?`<div class="tree-role">${esc(role)}</div>`:''}</div>`;
  }
  const url = pigMainPhotoUrl(pig);
  return `<div class="tree-node${isCurrent?' current':''}" ${isCurrent?'':`data-nav="#/pigs/${pig.id}"`}>
    <div class="tree-thumb">${url?`<img src="${esc(url)}" alt="${esc(pig.name)}">`:emojiOf(pig)}</div>
    <div class="tree-name">${esc(pig.name)}</div>
    ${role?`<div class="tree-role">${esc(role)}</div>`:''}
  </div>`;
}
function treeStem(){ return '<div class="tree-stem"></div>'; }
function treeBranchHtml(pairs){
  // pairs: array of {pig, role}
  return `<div class="tree-branch"><div class="tree-hline"></div><div class="tree-nodes">
    ${pairs.map(p => `<div class="tree-leaf"><span class="tree-vline"></span>${treeNodeHtml(p.pig, p.role, false)}</div>`).join('')}
  </div></div>`;
}

function buildFamilyTree(pig){
  const mother = pig.motherId ? pigById(pig.motherId) : null;
  const father = pig.fatherId ? pigById(pig.fatherId) : null;
  const children = STATE.pigs.filter(c => c.motherId === pig.id || c.fatherId === pig.id);

  if(!mother && !father && !children.length) return null;

  const gff = father && father.fatherId ? pigById(father.fatherId) : null;
  const gfm = father && father.motherId ? pigById(father.motherId) : null;
  const gmf = mother && mother.fatherId ? pigById(mother.fatherId) : null;
  const gmm = mother && mother.motherId ? pigById(mother.motherId) : null;
  const hasGrandparents = !!(gff || gfm || gmf || gmm);

  let html = '<div class="tree">';

  if(hasGrandparents){
    html += `<div class="tree-tier grandparents">
      ${treeNodeHtml(gff,'',false)}${treeNodeHtml(gfm,'',false)}
      <div class="tree-spacer"></div>
      ${treeNodeHtml(gmf,'',false)}${treeNodeHtml(gmm,'',false)}
    </div>`;
    html += treeStem();
  }

  if(mother || father){
    html += treeBranchHtml([{pig:father, role:'Father'}, {pig:mother, role:'Mother'}]);
    html += treeStem();
  }

  html += `<div class="tree-tier current-tier">${treeNodeHtml(pig, '', true)}</div>`;

  if(children.length){
    html += treeStem();
    html += treeBranchHtml(children.map(c => ({pig:c, role:''})));
  }

  html += '</div>';
  return html;
}

/* ============================== REPORTS ============================== */
function last6MonthsKeys(){
  const keys = [];
  const now = new Date();
  for(let i=5;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    keys.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));
  }
  return keys;
}
function monthLabel(key){
  const [y,m] = key.split('-');
  return new Date(y, m-1, 1).toLocaleDateString(undefined, {month:'short'});
}

function viewReports(){
  const totalIncome = STATE.transactions.filter(t=>t.type==='income').reduce((s,t)=>s+Number(t.amount||0),0);

  return `

      <div class="m-card out"><div class="num">${money(totalExpense)}</div><div class="lbl">Total expenses</div></div>
    </div>
    <div class="chart-card"><h3>Income vs. expenses (6 months)</h3><canvas id="chartIncomeExpense"></canvas></div>
    <div class="chart-card"><h3>Spending by category</h3><canvas id="chartCategory"></canvas></div>
    <div class="chart-card"><h3>Herd changes (6 months)</h3><canvas id="chartHerd"></canvas></div>

}

let chartRefs = {};
function drawReportCharts(){
  if(typeof Chart === 'undefined') return;
  Object.values(chartRefs).forEach(c => { try{ c.destroy(); }catch(e){} });
  chartRefs = {};

  const months = last6MonthsKeys();
  const inkColor = getComputedStyle(document.body).getPropertyValue('--ink').trim() || '#2B241C';
  const gridColor = 'rgba(128,110,80,0.15)';

  // income vs expense
  const incomeByMonth = months.map(k => STATE.transactions.filter(t=>t.type==='income' && (t.date||'').startsWith(k)).reduce((s,t)=>s+Number(t.amount||0),0));
  const expenseByMonth = months.map(k => STATE.transactions.filter(t=>t.type==='expense' && (t.date||'').startsWith(k)).reduce((s,t)=>s+Number(t.amount||0),0));
  const ctx1 = document.getElementById('chartIncomeExpense');
  if(ctx1){
    chartRefs.ie = new Chart(ctx1, {
      type:'bar',
      data:{ labels: months.map(monthLabel), datasets:[
        {label:'Income', data:incomeByMonth, backgroundColor:'#4F6F52', borderRadius:4},
        {label:'Expenses', data:expenseByMonth, backgroundColor:'#A8442E', borderRadius:4}
      ]},
      options:{ responsive:true, plugins:{legend:{labels:{color:inkColor}}}, scales:{
        x:{ ticks:{color:inkColor}, grid:{display:false} },
        y:{ ticks:{color:inkColor}, grid:{color:gridColor} }
      }}
    });
  }

  // category breakdown
  const cats = ['feed','health','sale','purchase','construction','supplies','other'];
  const catColors = {feed:'#D9A83E', health:'#C97B72', sale:'#4F6F52', purchase:'#A8442E', construction:'#5B7A99', supplies:'#7E3020', other:'#6B5F4E'};
  const catTotals = cats.map(c => STATE.transactions.filter(t=>t.type==='expense' && t.category===c).reduce((s,t)=>s+Number(t.amount||0),0));
  const ctx2 = document.getElementById('chartCategory');
  if(ctx2){
    const hasData = catTotals.some(v=>v>0);
    chartRefs.cat = new Chart(ctx2, {
      type:'doughnut',
      data:{ labels: cats, datasets:[{ data: hasData?catTotals:[1], backgroundColor: cats.map(c=>catColors[c]), borderWidth:0 }] },
      options:{ responsive:true, plugins:{legend:{position:'bottom', labels:{color:inkColor}}} }
    });
  }

  // herd changes: born vs bought vs sold per month
  const bornByMonth = months.map(k => STATE.pigs.filter(p => p.source==='born' && (p.birthDate||'').startsWith(k)).length);
  const boughtByMonth = months.map(k => STATE.pigs.filter(p => p.source==='bought' && (p.acquiredDate||'').startsWith(k)).length);
  const soldByMonth = months.map(k => STATE.pigs.filter(p => p.status==='sold' && (p.saleDate||'').startsWith(k)).length);
  const ctx3 = document.getElementById('chartHerd');
  if(ctx3){
    chartRefs.herd = new Chart(ctx3, {
      type:'bar',
      data:{ labels: months.map(monthLabel), datasets:[
        {label:'Born', data:bornByMonth, backgroundColor:'#D9A83E', borderRadius:4},
        {label:'Bought', data:boughtByMonth, backgroundColor:'#4F6F52', borderRadius:4},
        {label:'Sold', data:soldByMonth, backgroundColor:'#A8442E', borderRadius:4}
      ]},
      options:{ responsive:true, plugins:{legend:{labels:{color:inkColor}}}, scales:{
        x:{ ticks:{color:inkColor}, grid:{display:false} },
        y:{ ticks:{color:inkColor}, grid:{color:gridColor}, beginAtZero:true, ticks:{precision:0, color:inkColor} }
      }}
    });
  }
}

function payOptionLabel(a){
  if(a.payOption === 'cash') return 'Monthly cash — ' + money(a.cashAmount);
  if(a.payOption === 'piglet1') return '1 ' + vocab().y + ' / month';
  if(a.payOption === 'piglet2') return '2 ' + vocab().ys + ' / month';
  return '—';
}

async function handleGenerateAgreementDoc(id){
  const a = STATE.agreements.find(x => x.id === id);
  if(!a) return;
  const html = buildAgreementHTML(a);
  const blob = new Blob([html], { type: 'text/html' });
  const safeName = (a.workerName||'agreement').replace(/[^a-z0-9]+/gi,'-').toLowerCase();
  await downloadBlob('agreement-' + safeName + '.html', blob);
}

async function handleAddAgreement(form){
  const fd = new FormData(form);
  const payOptionEl = document.querySelector('#payOptionRow .selected');
  const shortfallEl = document.querySelector('#shortfallRow .selected');
  const extras = [...document.querySelectorAll('#extrasRow .chip.active')].map(el => el.getAttribute('data-value'));

  const agreement = {
    workerName: fd.get('workerName').trim(),
    employerName: fd.get('employerName').trim(),
    representedBy: fd.get('representedBy').trim(),
    effectiveDate: fd.get('effectiveDate') || todayISO(),
    payOption: payOptionEl ? payOptionEl.dataset.value : 'cash',
    cashAmount: parseFloat(fd.get('cashAmount')) || 0,
    payDay: fd.get('payDay').trim(),
    pigletPrice: parseFloat(fd.get('pigletPrice')) || 0,
    payDayPiglet: fd.get('payDayPiglet').trim(),
    shortfall: shortfallEl ? shortfallEl.dataset.value : 'cash',
    workSchedule: fd.get('workSchedule').trim(),
    startDate: fd.get('startDate') || todayISO(),
    term: fd.get('term').trim(),
    extras,
    notes: fd.get('notes').trim(),
    createdAt: new Date().toISOString()
  };
  if(!agreement.workerName){ toast("Enter the worker's name"); return; }
  if(!db){ toast('Storage unavailable'); return; }
  try{
    const ref = await db.collection('agreements').add(agreement);
    await loadAll();
    location.hash = '#/agreements/' + ref.id;
    toast('Agreement saved');
  }catch(err){ console.error(err); toast('Could not save agreement'); }
}

async function handleDeleteAgreement(id){
  if(!confirm('Delete this agreement?')) return;
  if(!db) return;
  try{
    await db.doc('agreements/' + id).delete();
    await loadAll();
    location.hash = '#/agreements';
    toast('Agreement deleted');
  }catch(err){ console.error(err); toast('Could not delete agreement'); }
}

  };
